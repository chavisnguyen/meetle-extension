<!doctype html><meta charset="utf-8" />
<style>
  /* The site's shipped theme (rose, src/styles/themes.css of repos/englishmaile); web fonts are not loaded in a popup. */
  :root {
    --primary: #b5476b;
    --on-primary: #fff;
    --ink: #3b2a33;
    --muted: #6b5a63;
    --warm: #fbf6f4;
    --border: #ebddd8;
  }
  body {
    font:
      14px/1.45 system-ui,
      sans-serif;
    width: 300px;
    margin: 0;
    color: var(--ink);
    background: #fff;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--warm);
    border-bottom: 1px solid var(--border);
  }
  header img {
    width: 32px;
    height: 32px;
  }
  .brand {
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .brand b {
    color: var(--primary);
  }
  main {
    padding: 16px;
  }
  p {
    margin: 0 0 12px;
  }
  #cls {
    font-weight: 700;
    font-size: 15px;
  }
  #cls.warn {
    font-size: 13px;
    font-weight: 500;
    padding: 10px 12px;
    background: #fff7ed;
    border: 1px solid #fdba74;
    border-radius: 10px;
    color: #7c2d12;
  }
  #who {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 10px;
  }
  #who a {
    color: var(--primary);
  }
  #st,
  #lerr {
    color: var(--muted);
    font-size: 13px;
    min-height: 1em;
    margin: 8px 0 0;
  }
  #lerr {
    color: #b42318;
  }
  [hidden] {
    display: none !important;
  }
  button,
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    margin: 0 0 8px;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  button {
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    border-color: var(--primary);
  }
  #go {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
  }
  /* Google's own button: white, grey outline, the four-colour G (developers.google.com/identity/branding-guidelines). */
  #signin {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 40px;
    padding: 0 12px;
    color: #1f1f1f;
    border-color: #747775;
    border-radius: 4px;
    font-weight: 500;
  }
  #signin:hover {
    background: #f8f9fa;
    border-color: #747775;
  }
  #signin svg {
    width: 18px;
    height: 18px;
  }
  footer {
    padding: 0 16px 12px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
<header>
  <img src="/logo.svg" alt="" /><span class="brand"><b>Ms.</b> Mai Lê</span>
</header>
<main>
  <div id="login" hidden>
    <p>Đăng nhập bằng tài khoản Google của giáo viên để ghi hình buổi học.</p>
    <button id="signin">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
        />
        <path
          fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
        />
        <path
          fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
        /></svg
      ><span>Đăng nhập bằng Google</span>
    </button>
    <p id="lerr"></p>
  </div>
  <div id="app" hidden>
    <p id="who"><span id="email"></span> · <a href="#" id="out">Đăng xuất</a></p>
    <p id="cls"></p>
    <select id="ses" hidden></select>
    <button id="go" hidden>Ghi lại tab này</button><button id="stop" hidden>Dừng & upload</button>
    <p id="st"></p>
  </div>
</main>
<footer id="ver"></footer>
<script type="module" src="/src/popup.ts"></script>
